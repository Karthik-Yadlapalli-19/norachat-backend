[project]
name = "norachat-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "karthik", email = "1901.karthik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.0",
    "resend>=2.47.0",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
norachat-backend = "norachat_backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
